# Déploiement délégué au reusable famille (dev-pwa-config) : Pages + Firebase.
# base path = '/miss-ticket-pwa/' : le réutilisable le pose dans VITE_BASE_PATH.
# Le job Firebase utilise le secret FIREBASE_SERVICE_ACCOUNT_KEY (secrets: inherit).
name: Deploy to GitHub Pages & Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

jobs:
  deploy:
    uses: mister-guiiug/dev-pwa-config/.github/workflows/pwa-deploy.yml@v4
    # Le seul secret que `pwa-deploy.yml` déclare, nommé plutôt qu'hérité :
    # `secrets: inherit` enverrait TOUS les secrets du dépôt à un workflow
    # qui n'en attend qu'un.
    secrets:
      FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
    with:
      use-base-path: true
      firebase-project: miss-ticket
      firebase-only: firestore:rules,firestore:indexes
