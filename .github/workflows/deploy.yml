# Déploiement délégué au reusable famille (dev-pwa-config) : Pages + Firebase.
# base path = '/miss-ticket-pwa/' : le réutilisable le pose dans VITE_BASE_PATH.
# Le job Firebase utilise le secret FIREBASE_SERVICE_ACCOUNT_KEY (secrets: inherit).
name: Deploy to GitHub Pages & Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

jobs:
  deploy:
    uses: mister-guiiug/dev-pwa-config/.github/workflows/pwa-deploy.yml@v6
    # Le seul secret que `pwa-deploy.yml` déclare, nommé plutôt qu'hérité :
    # `secrets: inherit` enverrait TOUS les secrets du dépôt à un workflow
    # qui n'en attend qu'un.
    secrets:
      FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
    with:
      use-base-path: true
      # LE SEUL INTERRUPTEUR DE LA MESURE D'AUDIENCE, ET IL EST ICI.
      #
      # `pwa-deploy.yml` n'injecte QUE ce que l'appelant lui donne : sans
      # cette ligne, poser la variable de dépôt ne change rien au build et le
      # bandeau de consentement ne rend rien, faute d'identifiant. Relevé le
      # 15/09/2026 : zéro dépôt sur vingt la passait.
      #
      # Variable absente = chaîne vide = aucune mesure. Elle n'active donc
      # rien par elle-même : elle rend la variable capable d'agir.
      #
      # Le DSN Sentry n'est PAS un secret : il part dans le bundle comme toute
      # `VITE_*`. Absent, `initSentry` rend `null` avant d'importer.
      #
      # CE COMMENTAIRE EST ICI, PAS DANS LE BLOC : `build-env: |` est un bloc
      # littéral, où « # » n'introduit rien — la ligne est du texte, passée
      # telle quelle au script, qui la refuse (« attendu KEY=VALUE ») et fait
      # échouer le déploiement. Cassé de 17:11 à 19:45 le 16/09/2026.
      build-env: |
        VITE_POSTHOG_KEY=${{ vars.VITE_POSTHOG_KEY }}
        VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
      firebase-project: miss-ticket
      firebase-only: firestore:rules,firestore:indexes
