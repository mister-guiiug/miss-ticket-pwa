<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content-Security-Policy en défense en profondeur.
      'unsafe-inline' : styles injectés au build (vite).
      connect-src *.googleapis.com : Firebase Auth + Firestore.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.googleapis.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Miss Ticket PWA</title>
    <meta
      name="description"
      content="Contrôle à distance de vos sessions Ticketm****r"
    />
    <link rel="canonical" href="__SEO_HOME_URL__" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Miss Ticket" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="__SEO_HOME_URL__" />
    <meta property="og:title" content="Miss Ticket — télécommande PWA" />
    <meta
      property="og:description"
      content="Contrôle à distance de vos sessions depuis votre mobile."
    />
    <meta property="og:image" content="__SEO_LOGO_URL__" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Miss Ticket — télécommande PWA" />
    <meta
      name="twitter:description"
      content="Contrôle à distance de vos sessions depuis votre mobile."
    />
    <meta name="twitter:image" content="__SEO_LOGO_URL__" />

    <!-- Analytics (GTM/GA4) injecté par pwaSeoPlugin() — vide tant qu'aucun
         VITE_GTM_CONTAINER_ID / VITE_GA_MEASUREMENT_ID n'est configuré. -->
    __ANALYTICS_HEAD__
    <meta name="theme-color" content="#ff6b6b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    __ANALYTICS_BODY__
    <div id="app"></div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
