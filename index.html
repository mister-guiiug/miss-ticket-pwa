<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- CSP injectée au build par cspPlugin (@mister-guiiug/dev-pwa-config/vite-csp) :
         aucun script inline → script-src 'self'. connect-src Firebase (googleapis)
         défini dans vite.config. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Miss Ticket PWA</title>
    <meta
      name="description"
      content="Contrôle à distance de vos sessions Ticketm****r"
    />
    <link rel="canonical" href="__SEO_HOME_URL__" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Miss Ticket" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="__SEO_HOME_URL__" />
    <meta property="og:title" content="Miss Ticket — télécommande PWA" />
    <meta
      property="og:description"
      content="Contrôle à distance de vos sessions depuis votre mobile."
    />
    <meta property="og:image" content="__SEO_LOGO_URL__" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Miss Ticket — télécommande PWA" />
    <meta
      name="twitter:description"
      content="Contrôle à distance de vos sessions depuis votre mobile."
    />
    <meta name="twitter:image" content="__SEO_LOGO_URL__" />

    <!--
      LES MARQUEURS `__ANALYTICS_*__` ONT ÉTÉ RETIRÉS.

      `pwaSeoPlugin` les remplaçait AU BUILD par le tag de Google dès qu'un
      identifiant était posé — précédé d'un `consent default` tout refusé, donc
      sans collecte, mais le script partait quand même au chargement.

      `ConsentBanner` fait le même travail autrement : il n'injecte RIEN avant
      l'accord. Garder les deux ferait partir DEUX tags le jour où la variable
      serait posée.
    -->
    <meta name="theme-color" content="#ff6b6b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Relatif, pas « /manifest.json » : ce lien absolu visait la racine de
         l'ORIGINE (mister-guiiug.github.io), pas le site — 404 en production,
         l'app ne s'installait pas (relevé du 02/09/2026). -->
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon-192.png" />
  </head>
  <body>
    <div id="app"></div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
